apply plugin: 'com.android.application'

android {
    namespace 'com.elhelbawy.law.office'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.elhelbawy.law.office"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SERVER_URL", "\"https://ais-dev-fehsloy5i45apg2cjmbmbg-54187893681.europe-west3.run.app\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
